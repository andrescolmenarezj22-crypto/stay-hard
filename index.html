<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>DisciplinaPro</title>
  <meta name="description" content="Sistema personal de disciplina, entrenamiento, hábitos y progreso. PWA profesional.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DisciplinaPro">
  <meta name="application-name" content="DisciplinaPro">
  <meta name="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Splash Screen -->
  <div id="splash-screen" class="splash">
    <div class="splash-content">
      <div class="splash-logo">
        <div class="logo-ring"></div>
        <div class="logo-ring ring-2"></div>
        <div class="logo-ring ring-3"></div>
        <span class="logo-icon">⚡</span>
      </div>
      <h1 class="splash-title">DisciplinaPro</h1>
      <p class="splash-sub">Disciplina. Constancia. Progreso.</p>
      <div class="splash-loader">
        <div class="loader-bar"></div>
      </div>
    </div>
  </div>

  <!-- Install Banner -->
  <div id="install-banner" class="install-banner" style="display:none;">
    <div class="install-banner-inner">
      <span class="install-icon">📥</span>
      <span>Instalar DisciplinaPro</span>
      <button class="btn btn-sm btn-primary" onclick="App.installApp()">Instalar</button>
      <button class="btn-icon" onclick="App.hideInstallBanner()" aria-label="Cerrar">✕</button>
    </div>
  </div>

  <!-- App Header -->
  <header id="app-header" class="app-header">
    <div class="header-left">
      <span class="header-logo">⚡</span>
      <span class="header-brand">DisciplinaPro</span>
    </div>
    <div class="header-right">
      <button class="btn-icon" onclick="App.navigate('profile')" title="Mi perfil">👤</button>
    </div>
  </header>

  <!-- Main Content -->
  <main id="app-main" class="app-main">
    <section id="view-home" class="view active"></section>
    <section id="view-train" class="view"></section>
    <section id="view-missions" class="view"></section>
    <section id="view-progress" class="view"></section>
    <section id="view-settings" class="view"></section>
    <section id="view-profile" class="view"></section>
    <section id="view-calendar" class="view"></section>
    <section id="view-achievements" class="view"></section>
    <section id="view-habits" class="view"></section>
    <section id="view-routine-editor" class="view"></section>
    <section id="view-timer" class="view"></section>
    <section id="view-quotes" class="view"></section>
    <section id="view-routine" class="view"></section>
  </main>

  <!-- Bottom Navigation (Mobile) -->
  <nav id="bottom-nav" class="bottom-nav">
    <button class="nav-item active" data-view="home">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Inicio</span>
    </button>
    <button class="nav-item" data-view="routine">
      <span class="nav-icon">🪖</span>
      <span class="nav-label">Rutina</span>
    </button>
    <button class="nav-item" data-view="train">
      <span class="nav-icon">🏋️</span>
      <span class="nav-label">Entrenar</span>
    </button>
    <button class="nav-item" data-view="missions">
      <span class="nav-icon">🎯</span>
      <span class="nav-label">Misiones</span>
    </button>
    <button class="nav-item" data-view="progress">
      <span class="nav-icon">📊</span>
      <span class="nav-label">Progreso</span>
    </button>
  </nav>

  <!-- Sidebar Navigation (Desktop) -->
  <aside id="sidebar-nav" class="sidebar-nav">
    <div class="sidebar-header">
      <span class="sidebar-logo">⚡</span>
      <span class="sidebar-brand">DisciplinaPro</span>
    </div>
    <div class="sidebar-items">
      <button class="nav-item active" data-view="home">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">Inicio</span>
      </button>
      <button class="nav-item" data-view="routine">
        <span class="nav-icon">🪖</span>
        <span class="nav-label">Rutina</span>
      </button>
      <button class="nav-item" data-view="train">
        <span class="nav-icon">🏋️</span>
        <span class="nav-label">Entrenar</span>
      </button>
      <button class="nav-item" data-view="missions">
        <span class="nav-icon">🎯</span>
        <span class="nav-label">Misiones</span>
      </button>
      <button class="nav-item" data-view="habits">
        <span class="nav-icon">✅</span>
        <span class="nav-label">Hábitos</span>
      </button>
      <button class="nav-item" data-view="progress">
        <span class="nav-icon">📊</span>
        <span class="nav-label">Progreso</span>
      </button>
      <button class="nav-item" data-view="calendar">
        <span class="nav-icon">📅</span>
        <span class="nav-label">Calendario</span>
      </button>
      <button class="nav-item" data-view="achievements">
        <span class="nav-icon">🏆</span>
        <span class="nav-label">Logros</span>
      </button>
      <button class="nav-item" data-view="quotes">
        <span class="nav-icon">💬</span>
        <span class="nav-label">Frases</span>
      </button>
      <button class="nav-item" data-view="profile">
        <span class="nav-icon">👤</span>
        <span class="nav-label">Perfil</span>
      </button>
      <button class="nav-item" data-view="settings">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">Configuración</span>
      </button>
    </div>
    <div class="sidebar-footer">
      <button class="nav-item" onclick="App.navigate('habits')">
        <span class="nav-icon">✅</span>
        <span class="nav-label">Hábitos</span>
      </button>
      <button class="nav-item" onclick="App.navigate('calendar')">
        <span class="nav-icon">📅</span>
        <span class="nav-label">Calendario</span>
      </button>
      <button class="nav-item" onclick="App.navigate('achievements')">
        <span class="nav-icon">🏆</span>
        <span class="nav-label">Logros</span>
      </button>
      <button class="nav-item" onclick="App.navigate('quotes')">
        <span class="nav-icon">💬</span>
        <span class="nav-label">Frases</span>
      </button>
      <button class="nav-item" onclick="App.navigate('profile')">
        <span class="nav-icon">👤</span>
        <span class="nav-label">Perfil</span>
      </button>
    </div>
  </aside>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/quotes.js"></script>
  <script src="js/app.js"></script>

  <!-- Register Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(function() {});
    }
  </script>

</body>
</html>
